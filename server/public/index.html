<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>Inventor - Hệ thống Quản lý Kho</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">

    <!-- QR Scanner Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --safe-area-top: env(safe-area-inset-top);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        .nav-label {
            font-family: 'Outfit', sans-serif;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #3b82f6, #1d4ed8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Login Screen */
        #login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            padding: 24px;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .login-logo h1 {
            color: var(--primary);
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            /* Prevents auto-zoom on iOS */
            background: white;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
        }

        .btn-primary:active {
            transform: scale(0.98);
            background: var(--primary-dark);
        }

        /* App Layout */
        #app {
            display: none;
            min-height: 100vh;
            padding-top: var(--safe-area-top);
            padding-bottom: calc(85px + var(--safe-area-bottom));
        }

        #app.active {
            display: block;
        }

        .app-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: calc(16px + var(--safe-area-top)) 20px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .app-header h1 {
            font-size: 22px;
            color: var(--text);
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: var(--shadow);
        }

        .logout-btn {
            background: #f1f5f9;
            border: none;
            color: var(--text-secondary);
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
        }

        /* Main Content */
        .content {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid #f1f5f9;
        }

        .card-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--text);
        }

        .scan-btn {
            width: 100%;
            padding: 24px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            background: #fff;
        }

        .readonly-input {
            background: #f8fafc !important;
            color: var(--primary);
            font-weight: 700;
            border-color: #dbeafe !important;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            padding: 12px 10px calc(12px + var(--safe-area-bottom));
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .nav-label {
            font-size: 11px;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 25%;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            border: 2px solid white;
        }

        /* History items */
        .history-item {
            background: #fff;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            border: 1px solid #f1f5f9;
            box-shadow: var(--shadow-sm);
        }

        .history-sku {
            color: var(--primary);
            font-weight: 700;
        }

        .history-qty {
            font-size: 20px;
            font-weight: 800;
            color: var(--secondary);
        }

        /* Camera Modal */
        #camera-modal {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 2000;
            display: none;
        }

        #camera-modal.active {
            display: flex;
            flex-direction: column;
        }

        #camera-preview {
            flex: 1;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .scan-frame {
            width: 260px;
            height: 260px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            position: relative;
        }

        .scan-frame::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            animation: scan 2s ease-in-out infinite;
        }

        @keyframes scan {

            0%,
            100% {
                top: 10%;
            }

            50% {
                top: 90%;
            }
        }

        .camera-close-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            padding: 16px 32px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-weight: 700;
            pointer-events: auto;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .tab-content.active {
            animation: fadeIn 0.4s ease-out;
        }

        @media (max-width: 400px) {
            .login-card {
                padding: 32px 24px;
            }

            .login-logo h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Đang tải...</div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="hidden">
        <div class="login-card">
            <div class="login-logo">
                <h1>📦 Inventor</h1>
                <p>Hệ thống Quản lý Kho</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">
                    Đăng nhập
                </button>
            </form>
            <div id="login-error" class="alert alert-error hidden" style="margin-top: 16px;">
                <span>❌</span>
                <span id="login-error-text"></span>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app">
        <!-- Header -->
        <div class="app-header">
            <h1 id="header-title">Kiểm kê kho</h1>
            <div class="user-info">
                <div class="user-avatar" id="user-avatar">U</div>
                <button class="logout-btn" onclick="logout()">Đăng xuất</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Scanner Tab -->
            <div id="tab-scanner" class="tab-content active">
                <div class="card scanner-section">
                    <button class="scan-btn" onclick="openScanner()">
                        <span class="scan-icon">📷</span>
                        <span>QUÉT MÃ QR</span>
                    </button>
                </div>

                <div class="card">
                    <h3 class="card-title">Thông tin kiểm kê</h3>

                    <div class="input-group">
                        <label>Mã sản phẩm (SKU)</label>
                        <input type="text" id="sku-input" list="sku-list" placeholder="Quét hoặc nhập mã">
                        <datalist id="sku-list"></datalist>
                    </div>

                    <div class="input-group">
                        <label>Kho</label>
                        <input type="text" id="warehouse-input" list="warehouse-list" placeholder="Tên kho">
                        <datalist id="warehouse-list"></datalist>
                    </div>

                    <div class="input-group">
                        <label>Pcs/Bag</label>
                        <input type="number" id="pcs-per-bag" placeholder="0" inputmode="decimal">
                    </div>

                    <div class="input-row">
                        <div class="input-group">
                            <label>Ngang</label>
                            <input type="number" id="ngang" placeholder="0" value="0" inputmode="numeric">
                        </div>
                        <div class="input-group">
                            <label>Dọc</label>
                            <input type="number" id="doc" placeholder="0" value="0" inputmode="numeric">
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group">
                            <label>Chẵn</label>
                            <input type="number" id="chan" placeholder="0" value="0" inputmode="numeric">
                        </div>
                        <div class="input-group">
                            <label>Lẻ</label>
                            <input type="number" id="le" placeholder="0" value="0" inputmode="numeric">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Pcs Lẻ</label>
                        <input type="number" id="pcs-le" placeholder="0" value="0" inputmode="decimal">
                    </div>

                    <div class="input-group">
                        <label>Tổng số lượng</label>
                        <input type="text" id="total-qty" placeholder="0" readonly class="readonly-input">
                    </div>

                    <div id="alert-container"></div>

                    <button class="btn btn-primary" onclick="submitAudit()" id="submit-btn">
                        Lưu dữ liệu
                    </button>
                </div>
            </div>

            <!-- History Tab -->
            <div id="tab-history" class="tab-content">
                <div class="card">
                    <h3 class="card-title">Lịch sử kiểm kê</h3>
                    <ul class="history-list" id="history-list">
                        <li style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            Đang tải...
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Notifications Tab -->
            <div id="tab-notifications" class="tab-content">
                <div class="card">
                    <h3 class="card-title">Thông báo</h3>
                    <ul class="history-list" id="notifications-list">
                        <li style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            Chưa có thông báo
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('scanner')">
                <div class="nav-icon">🧮</div>
                <div class="nav-label">Máy tính</div>
            </button>
            <button class="nav-item" onclick="switchTab('history')">
                <div class="nav-icon">📋</div>
                <div class="nav-label">Lịch sử</div>
            </button>
            <button class="nav-item" onclick="switchTab('notifications')">
                <div class="nav-icon">🔔</div>
                <div class="nav-label">Thông báo</div>
                <span class="badge hidden" id="notif-badge">0</span>
            </button>
        </div>
    </div>

    <!-- Camera Modal -->
    <div id="camera-modal">
        <video id="camera-preview" autoplay playsinline></video>
        <div class="camera-overlay">
            <div class="scan-frame"></div>
            <button class="camera-close-btn" onclick="closeScanner()">Đóng máy ảnh</button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
